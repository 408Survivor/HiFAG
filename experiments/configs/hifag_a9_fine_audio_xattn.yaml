# HiFAG A9: fine + audio with cross-attention fusion (coarse branch OFF).
# Purpose: the key ablation — isolate the coarse branch's contribution in the
# full-modality setting. A8 (fine+coarse+audio, x-attn) reached
# 0.7863 +/- 0.0088, matching the AFGNN baseline within 1 std but not yet
# proving the coarse graph adds value. A9 == A8 minus coarse; the paired
# A8 - A9 difference per seed is the coarse branch's net increment.
# NOTE: with use_coarse=false this is architecturally equivalent to the
# AFGNN face_enhanced_focal baseline retrained under the HiFAG pipeline.

data:
  processed_dir: /data/ltq/DVlog/processed_official_features
  num_frames: 32
  audio_num_frames: 32

model:
  use_fine: true
  use_coarse: false             # <-- the only architectural change vs A8
  use_audio: true

  # Fine branch (AFGNN FaceGNN, mirrors afgnn_face_enhanced_focal.yaml)
  face_in_channels: 13      # [x, y, dx, dy] + 9-dim region one-hot
  face_hidden_channels: 128
  face_out_channels: 128
  face_num_layers: 3
  face_heads: 4

  # Audio branch (AFGNN AudioGNN, mirrors afgnn_face_enhanced_focal.yaml)
  audio_in_channels: 25
  audio_hidden_channels: 64
  audio_out_channels: 64
  audio_num_layers: 2
  audio_heads: 4

  # Fusion: cross-modal attention (face side = fine only, 128-dim vs audio)
  fusion_type: "cross_attention"
  fusion_hidden_dim: 64

  # Classification head
  mlp_hidden: 128
  dropout: 0.5

  # Fine face graph structure
  add_static_edges: true
  add_temporal_edges: true
  add_region_onehot: true
  add_self_loops: true

# Data augmentation disabled
augmentation:
  enabled: false

training:
  batch_size: 32
  num_workers: 4
  epochs: 100
  patience: 15
  lr: 0.001
  weight_decay: 0.0001
  checkpoint_path: experiments/checkpoints/hifag_a9_fine_audio_xattn_best.pt

  early_stopping_metric: "auc"

  # Loss: focal (SFAF best recipe; do NOT lower alpha below 0.25)
  loss: "focal"
  focal_alpha: 0.25
  focal_gamma: 2.0

  scheduler:
    type: "plateau"
    factor: 0.5
    patience: 5

  grad_clip: 1.0
