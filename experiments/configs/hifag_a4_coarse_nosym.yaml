# HiFAG A4: coarse-only, symmetry features dropped (ablation A4).
# Purpose: measure the symmetry features' contribution to the coarse branch's
# standalone power (baseline: A2 coarse-only 0.6599 +/- 0.0095). Symmetry
# descriptors (sym_centroid / sym_velocity) were among the strongest univariate
# signals in the sanity check, so A2 - A4 quantifies their net value.
# Descriptor: 8 dims (geometry + motion), computed with drop_groups=["symmetry"].

data:
  processed_dir: /data/ltq/DVlog/processed_official_features
  num_frames: 32
  audio_num_frames: 32

model:
  use_fine: false
  use_coarse: true
  use_audio: false

  # Coarse branch (RegionGNN)
  coarse_in_channels: 8       # 10-dim descriptors minus 2 symmetry dims
  coarse_drop_groups: ["symmetry"]
  coarse_hidden_channels: 64
  coarse_out_channels: 64
  coarse_num_layers: 2
  coarse_heads: 4
  coarse_edge_mode: "anatomical"
  coarse_normalize: true

  # Classification head
  mlp_hidden: 128
  dropout: 0.5

  # Fine face graph structure (still built by the dataset; the coarse
  # descriptors are derived from its sampled coordinates)
  add_static_edges: true
  add_temporal_edges: true
  add_region_onehot: true
  add_self_loops: true

# Data augmentation disabled
augmentation:
  enabled: false

training:
  batch_size: 32
  num_workers: 4
  epochs: 100
  patience: 15
  lr: 0.001
  weight_decay: 0.0001
  checkpoint_path: experiments/checkpoints/hifag_a4_coarse_nosym_best.pt

  early_stopping_metric: "auc"

  # Loss: focal (SFAF best recipe; do NOT lower alpha below 0.25)
  loss: "focal"
  focal_alpha: 0.25
  focal_gamma: 2.0

  scheduler:
    type: "plateau"
    factor: 0.5
    patience: 5

  grad_clip: 1.0
